name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      # The Makefile exports this for its own uv invocations, but the
      # source-scoped coverage command runs uv directly and rebuilds
      # the tei-rapporteur PyO3 extension, which needs the stable-ABI
      # escape hatch under Python 3.14 (PyO3 0.23 supports up to 3.13).
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install "${tool}"; done

      - name: Install VidaiMock
        env:
          VIDAIMOCK_VERSION: "0.1.3"
          VIDAIMOCK_SHA256: "214032f365b7f6d8e43fc32fbdb73a2f5d1ccec963c20807eb0675260af16665"
        run: |
          curl -fsSL -o vidaimock-linux-x64.tar.gz \
            "https://github.com/vidaiUK/VidaiMock/releases/download/v${VIDAIMOCK_VERSION}/vidaimock-linux-x64.tar.gz"
          echo "${VIDAIMOCK_SHA256}  vidaimock-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf vidaimock-linux-x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv vidaimock/vidaimock "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/vidaimock"
          rm -rf vidaimock vidaimock-linux-x64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vidaimock" --version

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check migration drift
        run: make check-migrations

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          version: "0.6.0"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff  # v24.2.0
        with:
          globs: '**/*.md'

      - name: Run lint
        run: make lint

      - name: Check spelling
        run: make spelling

      - name: Check CPython syntax with Pylint
        run: |
          uv tool run --python 3.14 --from 'pylint==4.*' pylint \
            --disable=all \
            --enable=syntax-error \
            --recursive=y \
            alembic episodic openai_test_types.py tests

      - name: Run typechecker
        run: make typecheck

      - name: Check vidaimock is available
        run: |
          if ! command -v vidaimock >/dev/null 2>&1; then
            echo "ERROR: vidaimock binary not found in PATH"
            exit 1
          fi

      # Default-branch coverage and its upload are handled by coverage-main.yml.
      - name: Run tests
        if: github.event_name != 'pull_request'
        run: make test

      # Pull requests enforce production coverage locally against the latest
      # default-branch cache baseline. They do not contact CodeScene.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          format: cobertura
          output-path: coverage.xml
          # CodeScene measures production coverage. Scoping Slipcover to the
          # application and migration packages keeps test implementation detail
          # out of the signal, and counts a production module that no test
          # imports as the nought it is.
          python-source: episodic,alembic
          with-ratchet: 'true'
          pytest-workers: ''
