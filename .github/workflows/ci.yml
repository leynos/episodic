name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-test:
    runs-on: ubuntu-latest
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      # The Makefile exports this for its own uv invocations, but the
      # source-scoped coverage command runs uv directly and rebuilds
      # the tei-rapporteur PyO3 extension, which needs the stable-ABI
      # escape hatch under Python 3.14 (PyO3 0.23 supports up to 3.13).
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          # Full history so `cs-coverage check` can reach the pull
          # request's merge base.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      # The Makefile scopes uv to repo-local cache and tool directories,
      # so caching them preserves the Skylos tool environment, the
      # duplication gate's PyChase script environment (Python 3.13), and
      # the pinned pylint/df12 tool environments between runs. The
      # Makefile and gate script pin those tool versions, so their
      # hashes key the cache alongside the project lockfile.
      - name: Cache uv tool and script environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .uv-cache
            .uv-tools
          key: uv-envs-${{ runner.os }}-${{ hashFiles('uv.lock', 'Makefile', 'scripts/duplication_gate.py') }}
          restore-keys: |
            uv-envs-${{ runner.os }}-

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install "${tool}"; done
          npm install -g markdownlint-cli2

      - name: Install VidaiMock
        env:
          VIDAIMOCK_VERSION: "0.1.3"
          VIDAIMOCK_SHA256: "214032f365b7f6d8e43fc32fbdb73a2f5d1ccec963c20807eb0675260af16665"
        run: |
          curl -fsSL -o vidaimock-linux-x64.tar.gz \
            "https://github.com/vidaiUK/VidaiMock/releases/download/v${VIDAIMOCK_VERSION}/vidaimock-linux-x64.tar.gz"
          echo "${VIDAIMOCK_SHA256}  vidaimock-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf vidaimock-linux-x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv vidaimock/vidaimock "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/vidaimock"
          rm -rf vidaimock vidaimock-linux-x64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vidaimock" --version

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check migration drift
        run: make check-migrations

      - name: Check formatting
        run: make check-fmt

      - name: Run lint
        run: make lint

      - name: Run duplication gate tests
        run: make duplication-test

      - name: Check spelling
        run: make spelling

      - name: Check CPython syntax with Pylint
        run: |
          uv tool run --python 3.14 --from 'pylint==4.*' pylint \
            --disable=all \
            --enable=syntax-error \
            --recursive=y \
            alembic episodic openai_test_types.py tests

      - name: Run typechecker
        run: make typecheck

      - name: Check vidaimock is available
        run: |
          if ! command -v vidaimock >/dev/null 2>&1; then
            echo "ERROR: vidaimock binary not found in PATH"
            exit 1
          fi

      # On push to main, coverage (and its CodeScene upload) is handled
      # by coverage-main.yml, so this job just runs the plain suite here.
      - name: Run tests
        if: github.event_name != 'pull_request'
        run: make test

      # Coverage runs on pull requests only. Pushes to main upload their
      # own coverage via
      # coverage-main.yml, so generating it here as well would duplicate
      # the work and the CodeScene upload for the same commit.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        # CodeScene measures production coverage. Restrict Slipcover to the
        # application and migration packages so test implementation detail
        # cannot dilute the quality signal.
        run: >-
          uv run --with 'slipcover==1.0.18' python -m slipcover
          --source episodic,alembic --branch --xml --out coverage.xml
          -m pytest -v

      # CodeScene project 76628's coverage gate has been enabled
      # CodeScene-side (verified via GET /v2/code-coverage/projects/76628/config
      # returning a populated `gates` array, matching mxd's working
      # project), so `cs-coverage check` now has a gates configuration
      # to evaluate against.
      - name: Check coverage against CodeScene gates
        env:
          CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN }}
        if: env.CS_ACCESS_TOKEN != '' && github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@f4764bea8d813b1a8f7ebc37a44907d3c3b1e0e4
        with:
          format: cobertura
          mode: check
          project-url: https://api.codescene.io/v2/projects/76628
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ vars.CODESCENE_CLI_SHA256 }}
