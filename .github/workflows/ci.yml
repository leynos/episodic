name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only checks out and builds the repository,
# so `contents: read` covers every step. The CodeScene upload action posts
# no check runs or commit statuses and uploads its artefact with the
# default runtime token, so it needs no additional scopes.
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      # The Makefile exports this for its own uv invocations, but the
      # source-scoped coverage command runs uv directly and rebuilds
      # the tei-rapporteur PyO3 extension, which needs the stable-ABI
      # escape hatch under Python 3.14 (PyO3 0.23 supports up to 3.13).
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      # py-pglite runs `npm install` to fetch the PGlite WebAssembly runtime
      # the SQLAlchemy fixtures drive. py-pglite caps that install at a fixed
      # 60 seconds and does not catch the resulting timeout, so serving it
      # from a warm npm cache keeps a slow registry from failing the suite.
      # The key carries the pinned py-pglite version, so a bump misses the
      # cache and refetches.
      - name: Cache npm packages for py-pglite
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-py-pglite-0.5.3
          restore-keys: |
            npm-${{ runner.os }}-py-pglite-

      # The Makefile scopes uv to repo-local cache and tool directories,
      # so caching them preserves the df12 gate tool environments and the
      # pinned pylint tool environment between runs. The Makefile pins those
      # tool versions, so its hash keys the cache alongside the project
      # lockfile.
      - name: Cache uv tool and script environments
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .uv-cache
            .uv-tools
          key: uv-envs-${{ runner.os }}-${{ hashFiles('uv.lock', 'Makefile') }}
          restore-keys: |
            uv-envs-${{ runner.os }}-

      # After the uv cache restore, so the checker's pinned environment is
      # served from `.uv-tools` instead of being fetched on every clean runner.
      - name: Check the CV-005 contracts
        run: make test-workflow-contracts

      - name: Install CLI tools
        run: |
          for tool in mbake ty ruff; do uv tool install "${tool}"; done

      - name: Install VidaiMock
        # The behavioural fixtures require `--isolated`, added in 0.2.8.
        # Keep this pin aligned with coverage-main.yml.
        env:
          VIDAIMOCK_VERSION: "0.3.1"
          VIDAIMOCK_SHA256: "d228cb27be8835d0e6f538f1cde5c7fcc1675223b7f7c0cb05218df1954d72c5"
        run: |
          curl -fsSL -o vidaimock-linux-x64.tar.gz \
            "https://github.com/vidaiUK/VidaiMock/releases/download/v${VIDAIMOCK_VERSION}/vidaimock-linux-x64.tar.gz"
          echo "${VIDAIMOCK_SHA256}  vidaimock-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf vidaimock-linux-x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv vidaimock/vidaimock "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/vidaimock"
          rm -rf vidaimock vidaimock-linux-x64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vidaimock" --version

      - name: Validate Makefile
        run: mbake validate Makefile

      - name: Install code
        run: make build

      - name: Check migration drift
        run: make check-migrations

      - name: Install mdtablefix
        # `make check-fmt` runs `mdtablefix --check --git`; 0.6.0 is the
        # first release with `--check` and `--git`.
        uses: leynos/shared-actions/.github/actions/install-mdtablefix@7d751eded578e48dacf43ab173d5820e6437c474
        with:
          version: "0.6.1"

      - name: Check formatting
        run: make check-fmt

      - name: Lint Markdown
        # The upstream action rather than an installation of our own: its
        # release carries the linter's whole dependency graph, so nothing is
        # resolved from the registry at run time, and Dependabot manages the
        # pin alongside the other actions. It reads .markdownlint-cli2.jsonc
        # from the workspace, so the rules and ignores match `make markdownlint`.
        uses: DavidAnson/markdownlint-cli2-action@696eb3f2509270d7b882d2aa68347bc676e7af34  # v25.0.0
        with:
          globs: '**/*.md'

      - name: Run lint
        run: make lint

      - name: Dead-code gate
        uses: leynos/shared-actions/.github/actions/df12-skylos@88ac795de687eda016db24983f87a25d6db49fdb

      - name: Duplication gate
        uses: leynos/shared-actions/.github/actions/df12-duplication@88ac795de687eda016db24983f87a25d6db49fdb

      - name: Check spelling
        run: make spelling

      - name: Run typechecker
        run: make typecheck

      - name: Check vidaimock is available
        run: |
          if ! command -v vidaimock >/dev/null 2>&1; then
            echo "ERROR: vidaimock binary not found in PATH"
            exit 1
          fi

      # Smoke-test the binary the suites above will use against this
      # repository's own fixture provider. It runs the installed binary with
      # `--config-dir` and `--isolated`, and asserts that only the configured
      # provider is served. A pin that loses `--isolated` fails here in one
      # place instead of failing every live-server scenario in the coverage
      # run below. The script drives a server and asserts on it; it is not a
      # suite runner, so it belongs outside the coverage step.
      - name: Smoke-test vidaimock isolation
        run: uv run --group dev python scripts/check_vidaimock_isolated.py

      # This job runs the suite only as the pull-request coverage step below.
      # On a push to main, coverage-main.yml runs the same suite under coverage
      # and uploads it, so a plain `make test` here would run every test twice
      # on the same commit. The CrossHair PEP 316 proof is a test in that suite
      # (tests/test_chrono_contracts.py), so both lanes run it. Held by
      # tests/test_suite_runs_once_contract.py.

      # Pull requests enforce production coverage locally against the latest
      # default-branch cache baseline. They do not contact CodeScene.
      - name: Generate coverage
        if: github.event_name == 'pull_request'
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          format: cobertura
          output-path: coverage.xml
          # CodeScene measures production coverage. Scoping Slipcover to the
          # application and migration packages keeps test implementation detail
          # out of the signal, and counts a production module that no test
          # imports as the nought it is.
          python-source: episodic,alembic
          with-ratchet: 'true'
          pytest-workers: ''
          publish-artefact: 'false'
