name: Coverage (main)

# CodeScene accepts coverage uploads only for analysed branches. This workflow
# measures and uploads the default branch, while pull requests measure coverage
# locally with the shared action's ratchet.
#
# workflow_dispatch is required, not optional: merges performed by the
# automerge workflow's GITHUB_TOKEN do not fire push-event workflows at
# all, so automerged changes to main only get coverage via a manual
# dispatch re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishers queue rather than race or cancel. Two runs writing the baseline
# at once is a lost update, and cancelling one abandons its write half done.
# A pull-request lane may cancel itself; a trunk publisher may not.
concurrency:
  group: coverage-main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  coverage-upload:
    # `publish-baseline: always` below also supports the manual main dispatch
    # used after an automerge that does not emit a push event. Do not let a
    # dispatch on another ref advance the baseline.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      # See the note in ci.yml: source-scoped coverage runs uv directly and
      # rebuilds the tei-rapporteur PyO3 extension, which
      # needs the stable-ABI escape hatch under Python 3.14.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Install VidaiMock
        env:
          VIDAIMOCK_VERSION: "0.1.3"
          VIDAIMOCK_SHA256: "214032f365b7f6d8e43fc32fbdb73a2f5d1ccec963c20807eb0675260af16665"
        run: |
          curl -fsSL -o vidaimock-linux-x64.tar.gz \
            "https://github.com/vidaiUK/VidaiMock/releases/download/v${VIDAIMOCK_VERSION}/vidaimock-linux-x64.tar.gz"
          echo "${VIDAIMOCK_SHA256}  vidaimock-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf vidaimock-linux-x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv vidaimock/vidaimock "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/vidaimock"
          rm -rf vidaimock vidaimock-linux-x64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vidaimock" --version

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          language: python
          format: cobertura
          output-path: coverage.xml
          # CodeScene measures production coverage. Scoping Slipcover to the
          # application and migration packages keeps test implementation detail
          # out of the signal, and counts a production module that no test
          # imports as the nought it is.
          python-source: episodic,alembic
          with-ratchet: 'true'
          publish-baseline: 'always'
          pytest-workers: ''

      - name: Check CodeScene token availability
        # Publishes whether the token exists, and nothing else. No `env` this
        # workflow declares holds the token: the upload is a composite
        # action, and a composite action's nested steps inherit the calling
        # step's environment, so a token placed there reaches every one of
        # them. The action binds it only in its own upload step's `env`.
        id: codescene_token
        run: echo "available=${{ secrets.CS_ACCESS_TOKEN != '' }}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data to CodeScene
        # The job above already restricts this workflow to main, and the
        # workflow answers only a main push or a dispatch. Guarding this
        # step on the push event alone would leave CodeScene with no
        # coverage for an automerge, which is the case the dispatch exists
        # to cover.
        if: steps.codescene_token.outputs.available == 'true' && github.ref == 'refs/heads/main'
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@dbe2e22ceaf498d85512679ccded38be9dbe7777
        with:
          format: cobertura
          mode: upload
          path: coverage.xml
          access-token: ${{ secrets.CS_ACCESS_TOKEN }}
