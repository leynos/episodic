name: Coverage (main)

# This workflow owns the production-coverage ratchet and its CodeScene upload.
# Pull-request CI only reads the ratchet and never receives CodeScene access.
#
# workflow_dispatch is required, not optional: merges performed by the
# automerge workflow's GITHUB_TOKEN do not fire push-event workflows at
# all, so automerged changes to main only get coverage via a manual
# dispatch re-run.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  coverage-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      CS_ACCESS_TOKEN: ${{ secrets.CS_ACCESS_TOKEN || '' }}
      CODESCENE_CLI_SHA256: ${{ vars.CODESCENE_CLI_SHA256 || '' }}
      CARGO_HTTP_MULTIPLEXING: "false"
      CARGO_NET_RETRY: "10"
      # See the note in ci.yml: source-scoped coverage runs uv directly and
      # rebuilds the tei-rapporteur PyO3 extension, which
      # needs the stable-ABI escape hatch under Python 3.14.
      PYO3_USE_ABI3_FORWARD_COMPATIBILITY: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1

      - name: Install VidaiMock
        env:
          VIDAIMOCK_VERSION: "0.1.3"
          VIDAIMOCK_SHA256: "214032f365b7f6d8e43fc32fbdb73a2f5d1ccec963c20807eb0675260af16665"
        run: |
          curl -fsSL -o vidaimock-linux-x64.tar.gz \
            "https://github.com/vidaiUK/VidaiMock/releases/download/v${VIDAIMOCK_VERSION}/vidaimock-linux-x64.tar.gz"
          echo "${VIDAIMOCK_SHA256}  vidaimock-linux-x64.tar.gz" | sha256sum -c -
          tar -xzf vidaimock-linux-x64.tar.gz
          mkdir -p "$HOME/.local/bin"
          mv vidaimock/vidaimock "$HOME/.local/bin/"
          chmod +x "$HOME/.local/bin/vidaimock"
          rm -rf vidaimock vidaimock-linux-x64.tar.gz
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/vidaimock" --version

      - name: Install code
        run: make build

      - name: Generate coverage
        uses: leynos/shared-actions/.github/actions/generate-coverage@ac272c8de8d34b6b773274f7c1a11041e23cf1eb
        with:
          language: python
          output-path: coverage.xml
          format: cobertura
          python-source: episodic,alembic
          pytest-workers: ''
          with-ratchet: 'true'
          # Automerge commits do not emit a push event, so a restricted manual
          # dispatch must also refresh the same main-owned baseline.
          publish-baseline: always

      - name: Upload coverage data to CodeScene
        if: env.CS_ACCESS_TOKEN != ''
        uses: leynos/shared-actions/.github/actions/upload-codescene-coverage@6b5cdc2d4c0bb72cafd5a66d24d248ac25827db9
        with:
          format: cobertura
          path: coverage.xml
          mode: upload
          access-token: ${{ env.CS_ACCESS_TOKEN }}
          installer-checksum: ${{ env.CODESCENE_CLI_SHA256 }}
