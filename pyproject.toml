[tool.hecate]
root_packages = ["episodic"]
default_rule_id = "ARCH001"

[[tool.hecate.groups]]
name = "composition_root"
prefixes = ["episodic.api.runtime", "episodic.worker.runtime"]
allowed = [
    "application",
    "composition_root",
    "domain_ports",
    "inbound_adapter",
