    "episodic.canonical.unit_of_work_protocols",
    "episodic.canonical.upload_protocols",
    "episodic.canonical.uploads",
    "episodic.cost.ports",
    "episodic.cost.engine",
    "episodic.llm.ports",
    "episodic.metrics_ports",
