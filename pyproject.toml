[project]
name = "episodic"
version = "0.1.0"
description = "episodic package"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "ISC" }
authors = [{ name = "Payton McIntosh", email = "pmcintosh@df12.net" }]
dependencies = [
    "alembic>=1.19.2,<2.0",
    "asyncpg>=0.20.0,<1.0",
    "celery>=5.5,<6.0",
    "cyclopts>=4.25.2,<5",
    "falcon>=4.3.1,<5.0",
    "femtologging @ git+https://github.com/leynos/femtologging@691a73962df8f99308a82348d99c4f707c245e63",
    "granian>=2.7.9,<3.0",
    "httpx>=0.28,<1.0",
    "kombu>=5.5,<6.0",
    "langgraph>=1.2.11,<2.0",
    "psycopg[binary]>=3.3.6,<4.0",
    "sqlalchemy>=2.0.52,<3.0.0",
    "tenacity>=8.0,<10",
    "tei-rapporteur @ git+https://github.com/leynos/tei-rapporteur@89fc86ef3952ecfde0bb7f653cde217e2651b895",
    "eventlet>=0.41.2,<0.42",
    "gevent>=26.8.0,<27.0",
]

[project.urls]
Homepage = "https://df12.studio/docs.html"
Repository = "https://github.com/leynos/episodic"

[project.scripts]
episodic = "episodic.cli:main"

[dependency-groups]
dev = [
    "crosshair-tool>=0.0.110,<0.1",
    "df12-python-lints @ git+https://github.com/leynos/df12-python-lints.git@v0.2.0",
    "hecate @ git+https://github.com/leynos/hecate@46f8c8798e7a80a3a1ab5a13c2a000a4423ffc12",
    "hypothesis[asyncio]>=6.168.1,<7",
    "mypy>=2.3.1,<3",
    "pytest>=9.1.1,<11",
    "pytest-bdd",
    "pytest-asyncio",
    "pytest-xdist",
    "py-pglite[async]>=0.5.3,<0.6.0",
    "ruff",
    "pyright",
    "syrupy>=5.5.3,<6",
    "ty",
    "pytest-timeout",
    "pyyaml>=6.0.3",
]

[tool.ruff]
line-length = 88
preview = true
target-version = "py314"

[tool.ty.src]
exclude = ["tests/fixtures/typecheck/"]

[tool.ruff.lint]
select = [
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "A",        # detect shadowed builtins
    "BLE",      # disallow catch-all exceptions
    "S",        # disallow things like "exec"; also restricts "assert" but I just NOQA it when I really need it
    "DTZ",      # require strict timezone manipulation with datetime
    "FBT",      # detect boolean traps
    "N",        # enforce naming conventions, e.g. ClassName vs function_name
    "FURB",
    "B",
    "RUF",
    "LOG",
    "Q",
    "PT",
    "RSE",
    "PERF",
    "TRY",
    "ASYNC",
    "D",
    "DOC",
    "ANN",
    "C90",
    "PLR",
    "modified-iterating-set",
    "no-classmethod-decorator",
    "no-staticmethod-decorator",
    "too-many-locals",
    "too-many-boolean-expressions",
    "too-many-nested-blocks",
    "non-augmented-assignment",
    "literal-membership",
    "no-self-use",
    "unnecessary-lambda",
    "none-not-at-end-of-union",
    "class-with-mixed-type-vars",
    "unnecessary-regular-expression",
    "non-octal-permissions",
    "property-without-return",
]
extend-ignore = [
    "incorrect-blank-line-before-class",  # Conflicts with D211; prefer enforcing no blank line before class docstring.
    "multi-line-summary-second-line",  # Conflicts with D212; keep summary on the first line.
]

[tool.ruff.lint.per-file-ignores]
"**/test_*.py" = ["assert", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]
"tests/steps/*.py" = ["assert", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]
"tests/fixtures/*.py" = ["assert", "too-many-arguments", "too-many-positional-arguments", "magic-value-comparison", "no-self-use"]
"tests/test_generation_orchestration_snapshots.py" = ["undocumented-public-function", "typing-only-third-party-import"]
"scripts/local_k8s.py" = ["boolean-type-hint-positional-argument", "boolean-default-value-positional-argument", "too-many-arguments", "too-many-positional-arguments"]
"scripts/local_k8s/*.py" = ["suspicious-subprocess-import"]
"tests/test_local_k8s_kind_tooling.py" = ["suspicious-subprocess-import"]
"tests/test_local_k8s_tooling.py" = ["suspicious-subprocess-import"]
"tests/workflow_reading.py" = ["assert"]
# Unprefixed support module: deliberately uncollected, so it misses the
# `**/test_*.py` ignores and needs `assert` declared the same way.
"tests/generation_run_contract_scenarios.py" = ["assert"]
"tests/generation_run_checkpoint_listing_scenarios.py" = ["assert"]

[tool.ruff.lint.flake8-import-conventions]
# Declare the banned `from` imports.
banned-from = [
    "typing",
    "datetime",
    "collections.abc",
    "dataclasses",
    "enum",
    "unittest.mock",
    "msgspec",
]

[tool.ruff.lint.flake8-import-conventions.aliases]
# Declare the default aliases.
altair = "alt"
"matplotlib.pyplot" = "plt"
numpy = "np"
pandas = "pd"
seaborn = "sns"
scipy = "sp"
"collections.abc" = "cabc"
datetime = "dt"
"unittest.mock" = "mock"
"msgspec.json" = "msjson"
typing = "typ"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"typing.AbstractSet".msg = "Use collections.abc.Set instead of deprecated typing generics."
"typing.AsyncContextManager".msg = "Use contextlib.AbstractAsyncContextManager instead of deprecated typing generics."
"typing.AsyncGenerator".msg = "Use collections.abc.AsyncGenerator instead of deprecated typing generics."
"typing.AsyncIterable".msg = "Use collections.abc.AsyncIterable instead of deprecated typing generics."
"typing.AsyncIterator".msg = "Use collections.abc.AsyncIterator instead of deprecated typing generics."
"typing.Awaitable".msg = "Use collections.abc.Awaitable instead of deprecated typing generics."
"typing.Callable".msg = "Use collections.abc.Callable instead of deprecated typing generics."
"typing.ChainMap".msg = "Use collections.ChainMap instead of deprecated typing generics."
"typing.Collection".msg = "Use collections.abc.Collection instead of deprecated typing generics."
"typing.Container".msg = "Use collections.abc.Container instead of deprecated typing generics."
"typing.ContextManager".msg = "Use contextlib.AbstractContextManager instead of deprecated typing generics."
"typing.Coroutine".msg = "Use collections.abc.Coroutine instead of deprecated typing generics."
"typing.Counter".msg = "Use collections.Counter instead of deprecated typing generics."
"typing.DefaultDict".msg = "Use collections.defaultdict instead of deprecated typing generics."
"typing.Deque".msg = "Use collections.deque instead of deprecated typing generics."
"typing.Dict".msg = "Use dict instead of deprecated typing generics."
"typing.FrozenSet".msg = "Use frozenset instead of deprecated typing generics."
"typing.Generator".msg = "Use collections.abc.Generator instead of deprecated typing generics."
"typing.ItemsView".msg = "Use collections.abc.ItemsView instead of deprecated typing generics."
"typing.Iterable".msg = "Use collections.abc.Iterable instead of deprecated typing generics."
"typing.Iterator".msg = "Use collections.abc.Iterator instead of deprecated typing generics."
"typing.KeysView".msg = "Use collections.abc.KeysView instead of deprecated typing generics."
"typing.List".msg = "Use list instead of deprecated typing generics."
"typing.Mapping".msg = "Use collections.abc.Mapping instead of deprecated typing generics."
"typing.Match".msg = "Use re.Match instead of deprecated typing generics."
"typing.MutableMapping".msg = "Use collections.abc.MutableMapping instead of deprecated typing generics."
"typing.MutableSequence".msg = "Use collections.abc.MutableSequence instead of deprecated typing generics."
"typing.MutableSet".msg = "Use collections.abc.MutableSet instead of deprecated typing generics."
"typing.OrderedDict".msg = "Use collections.OrderedDict instead of deprecated typing generics."
"typing.Pattern".msg = "Use re.Pattern instead of deprecated typing generics."
"typing.Reversible".msg = "Use collections.abc.Reversible instead of deprecated typing generics."
"typing.Sequence".msg = "Use collections.abc.Sequence instead of deprecated typing generics."
"typing.Set".msg = "Use set instead of deprecated typing generics."
"typing.Tuple".msg = "Use tuple instead of deprecated typing generics."
"typing.Type".msg = "Use type instead of deprecated typing generics."
"typing.ValuesView".msg = "Use collections.abc.ValuesView instead of deprecated typing generics."

[tool.ruff.lint.pydocstyle]
# Enforce NumPy docstring style
convention = "numpy"

[tool.ruff.lint.pydoclint]
# Concise one-line private helpers do not require structured sections; public
# entrypoints use multiline docstrings so their contracts remain checked.
ignore-one-line-docstrings = true

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 4
max-bool-expr = 2
max-locals = 10

[tool.pylint.main]
# Activate rules whose behaviour depends on the project's Python baseline.
py-version = "3.14"
# Expand directory targets like alembic and tests even when they are not packages.
recursive = true
# Match the project file-size ceiling enforced during review.
max-module-lines = 400

[tool.pylint.design]
# Keep function call surfaces small enough to understand without memorising
# positional argument order.
max-args = 4
# The new Pylint gate complements Ruff's stricter PLR0914 threshold without
# forcing broad refactors while introducing the additional rule families below.
max-locals = 20
# Use Pylint's statement-count proxy for function length; Pylint 4 does not
# expose a distinct physical-lines-per-function option.
max-statements = 70
# Keep positional call surfaces aligned with Ruff's existing argument limit.
max-positional-arguments = 4

[tool.pylint."messages control"]
# Keep this Pylint pass focused on the explicitly selected messages.
disable = [
    "all",
]
enable = [
    # Catch invalid %-style specifiers before log calls reach production.
    "logging-unsupported-format",
    # Catch truncated %-style logging templates that cannot be formatted.
    "logging-format-truncated",
    # Reject log records that pass arguments with no matching placeholders.
    "logging-too-many-args",
    # Reject log records whose placeholders cannot all be populated.
    "logging-too-few-args",
    # Preserve lazy logging by passing interpolation values to the logger.
    "logging-not-lazy",
    # Discourage eager str.format calls in logging statements.
    "logging-format-interpolation",
    # Discourage eager f-string interpolation in logging statements.
    "logging-fstring-interpolation",
    # Prevent bare match captures from making later cases unreachable.
    "bare-name-capture-pattern",
    # Ensure class pattern matching metadata has the required shape.
    "invalid-match-args-definition",
    # Catch positional class patterns that exceed declared __match_args__.
    "too-many-positional-sub-patterns",
    # Reject duplicate attribute patterns in one class match.
    "multiple-class-sub-patterns",
    # Prefer whole-pattern class binding when that avoids extra lookups.
    "match-class-bind-self",
    # Prefer explicit keyword class patterns over positional attributes.
    "match-class-positional-attributes",
    # Keep adjacent isinstance checks compact and easier to scan.
    "consider-merging-isinstance",
    # Flag deeply nested control flow before functions become hard to audit.
    "too-many-nested-blocks",
    # Replace boolean-only if statements with direct boolean expressions.
    "simplifiable-if-statement",
    # Catch local bindings that accidentally shadow function parameters.
    "redefined-argument-from-local",
    # Remove redundant else blocks after unconditional returns.
    "no-else-return",
    # Prefer explicit ternary expressions over pre-ternary idioms.
    "consider-using-ternary",
    # Catch accidental one-item tuples caused by stray trailing commas.
    "trailing-comma-tuple",
    # Avoid StopIteration escaping generators under PEP 479.
    "stop-iteration-return",
    # Simplify redundant boolean expressions.
    "simplify-boolean-expression",
    # Keep return contracts explicit and consistent within each function.
    "inconsistent-return-statements",
    # Remove terminal return None statements that add no behaviour.
    "useless-return",
    # Prefer tuple unpacking for variable swaps.
    "consider-swap-variables",
    # Prefer str.join for iterable string assembly.
    "consider-using-join",
    # Prefer membership checks over repeated equality comparisons.
    "consider-using-in",
    # Prefer dict.get when retrieving optional dictionary values.
    "consider-using-get",
    # Prefer chained comparisons for ordered relationships.
    "chained-comparison",
    # Prefer dictionary comprehensions over dict(list-comprehension) patterns.
    "consider-using-dict-comprehension",
    # Prefer set comprehensions over set(list-comprehension) patterns.
    "consider-using-set-comprehension",
    # Simplify boolean-only conditional expressions.
    "simplifiable-if-expression",
    # Remove redundant else blocks after unconditional raises.
    "no-else-raise",
    # Replace identity comprehensions with direct collection constructors.
    "unnecessary-comprehension",
    # Prefer sys.exit for explicit process termination.
    "consider-using-sys-exit",
    # Remove redundant else blocks after unconditional breaks.
    "no-else-break",
    # Remove redundant else blocks after unconditional continues.
    "no-else-continue",
    # Prefer Python 3 super() without explicit class and instance arguments.
    "super-with-arguments",
    # Simplify boolean conditions that have redundant structure.
    "simplifiable-condition",
    # Catch conditions that statically evaluate to constants.
    "condition-evals-to-constant",
    # Prefer generators when a container is only consumed immediately.
    "consider-using-generator",
    # Avoid unnecessary comprehensions inside any/all/min/max/sum.
    "use-a-generator",
    # Prefer min() over equivalent conditional assignments.
    "consider-using-min-builtin",
    # Prefer max() over equivalent conditional assignments.
    "consider-using-max-builtin",
    # Encourage context managers for resource-owning operations.
    "consider-using-with",
    # Avoid redundant dictionary lookups while iterating items.
    "unnecessary-dict-index-lookup",
    # Prefer [] for empty list creation.
    "use-list-literal",
    # Prefer {} for dictionary creation when a literal is clearer.
    "use-dict-literal",
    # Avoid redundant list index lookups while enumerating values.
    "unnecessary-list-index-lookup",
    # Prefer yield from for delegating iterable output.
    "use-yield-from",
    # Remove double negatives from boolean expressions.
    "unnecessary-negation",
    # Prefer enumerate over range(len(...)) loops.
    "consider-using-enumerate",
    # Iterate dictionaries directly instead of through keys().
    "consider-iterating-dictionary",
    # Prefer dict.items() when both keys and values are used.
    "consider-using-dict-items",
    # Use maxsplit when only the first or last split component is needed.
    "use-maxsplit-arg",
    # Prefer sequence literals for repeated iteration values.
    "use-sequence-for-iteration",
    # Prefer f-strings for non-logging eager string interpolation.
    "consider-using-f-string",
    # Prefer direct sequence truthiness over len(sequence).
    "use-implicit-booleaness-not-len",
    # Prefer direct sequence truthiness over comparison to an empty literal.
    "use-implicit-booleaness-not-comparison",
    # Prefer direct string truthiness over comparison to an empty string.
    "use-implicit-booleaness-not-comparison-to-string",
    # Prefer operators and builtins over direct dunder calls.
    "unnecessary-dunder-call",
    # Avoid placeholder ellipses when a concrete stub body is clearer.
    "unnecessary-ellipsis",
    # Ensure environment helper calls receive string values.
    "invalid-envvar-value",
    # Use singledispatchmethod for method dispatch.
    "singledispatch-method",
    # Use singledispatch for function dispatch.
    "singledispatchmethod-function",
    # Catch invalid file open modes early.
    "bad-open-mode",
    # Preserve compatibility awareness for datetime.time truthiness checks.
    "boolean-datetime",
    # Catch unittest assertions that cannot fail.
    "redundant-unittest-assert",
    # Ensure threading.Thread receives the target argument intentionally.
    "bad-thread-instantiation",
    # Prefer os.environ.copy() over shallow-copying the environment proxy.
    "shallow-copy-environ",
    # Ensure os.getenv defaults have the expected string-or-None shape.
    "invalid-envvar-default",
    # Avoid preexec_fn because it can deadlock in threaded programs.
    "subprocess-popen-preexec-fn",
    # Require explicit subprocess.run check semantics.
    "subprocess-run-check",
    # Require explicit encodings for file I/O portability.
    "unspecified-encoding",
    # Keep breakpoint hooks out of committed code.
    "forgotten-debug-statement",
    # Avoid unbounded method caches that retain self indefinitely.
    "method-cache-max-size-none",
    # Surface deprecated stdlib method usage.
    "deprecated-method",
    # Surface deprecated stdlib argument usage.
    "deprecated-argument",
    # Surface deprecated stdlib class usage.
    "deprecated-class",
    # Surface deprecated stdlib decorator usage.
    "deprecated-decorator",
    # Surface deprecated stdlib attribute usage.
    "deprecated-attribute",
    # Flag modules that have grown large enough to deserve splitting.
    "too-many-lines",
    # Keep trailing whitespace out of Python sources.
    "trailing-whitespace",
    # Require final newlines for stable text-file handling.
    "missing-final-newline",
    # Avoid excess blank lines at file end.
    "trailing-newlines",
    # Remove redundant parentheses around control-flow keywords.
    "superfluous-parens",
    # Catch mixed line endings before they create noisy diffs.
    "mixed-line-endings",
    # Enforce the configured line-ending format.
    "unexpected-line-ending-format",
    # Prevent mutating dictionaries while iterating them.
    "modified-iterating-dict",
    # Prevent mutating sets while iterating them.
    "modified-iterating-set",
    # Flag list mutation during iteration, where behaviour is easy to miss.
    "modified-iterating-list",
    # Keep public class surfaces small enough to understand.
    "too-many-public-methods",
    # Flag branch-heavy functions for refactoring.
    "too-many-branches",
    # Keep function signatures from accumulating too many parameters.
    "too-many-arguments",
    # Flag functions whose local state has become hard to follow.
    "too-many-locals",
    # Flag functions that do too much sequential work.
    "too-many-statements",
    # Keep compound boolean conditions readable.
    "too-many-boolean-expressions",
    # Keep positional call surfaces small and explicit.
    "too-many-positional-arguments",
]

[tool.pytest.ini_options]
# Tests automatically killed after seconds elapsed. Full-suite database fixture
# startup can exceed 60 seconds under shared CI or agent-host load when
# py-pglite starts a fresh PostgreSQL runtime and applies Alembic migrations.
timeout = 180
markers = [
    "act: integration tests that drive GitHub Actions via act",
    "crosshair: symbolic contract verification using CrossHair",
    "slow: exercises that take longer or require heavyweight tooling",
]
filterwarnings = [
    "ignore:Core Pydantic V1 functionality isn't compatible with Python 3\\.14 or greater\\.:UserWarning:langchain_core\\._api\\.deprecation",
    "ignore:\\s*Eventlet is deprecated\\.:DeprecationWarning",
]

[tool.mutmut]
source_paths = ["episodic/"]
pytest_add_cli_args_test_selection = ["tests/"]
# episodic/benchmarks/ is an ad-hoc CLI benchmark harness with no test
# coverage; mutating it would only produce permanent survivors.
do_not_mutate = ["episodic/benchmarks/*"]
# mutmut copies only tests/, pyproject.toml, setup.cfg, and root test*.py
# into its mutants/ working copy. The suite also needs these repo-root
# assets: alembic_helpers resolves alembic.ini and alembic/ from the
# package root; the container-image contract test reads the Dockerfile,
# .dockerignore, and the COPY sources uv.lock and README.md; the Helm
# contract test reads charts/; several adapter tests import the root
# openai_test_types module; the local-k8s tests import and execute
# scripts/; and the workflow contract tests read .github/workflows/.
also_copy = [
    ".dockerignore",
    ".github/",
    "Dockerfile",
    "README.md",
    "alembic.ini",
    "alembic/",
    "charts/",
    "openai_test_types.py",
    "scripts/",
    "uv.lock",
]

[tool.uv]
package = true

# The dead-code gate is the installed `df12-skylos` command from
# df12-python-lints. `roots` limits liveness analysis to the production sources
# the gate always scanned; the test, script and benchmark trees stay out of the
# liveness graph. Entry-point rules below are native Skylos configuration.
[tool.df12_skylos]
roots = ["alembic", "episodic", "openai_test_types.py"]
python = "3.14"

[tool.skylos.gate]
strict = true

[[tool.skylos.dead_code.entrypoints]]
type = "parameter"
full_name = [
    "episodic.api.app._ShutdownHooksMiddleware.process_shutdown.scope",
    "episodic.api.app._ShutdownHooksMiddleware.process_shutdown.event",
    "episodic.api.errors.serialize_http_error.req",
    "episodic.api.resources.health.HealthLiveResource.on_get.req",
    "episodic.api.resources.health.HealthReadyResource.on_get.req",
    "episodic.api.resources.reference_bindings.ReferenceBindingResource.on_get.req",
    "episodic.api.resources.reference_documents.ReferenceDocumentResource.on_get.req",
    "episodic.api.resources.source_intake.UploadResource.on_get.req",
    "episodic.api.resources.source_intake.IngestionJobResource.on_get.req",
]
reason = "Falcon supplies these callback parameters through its ASGI and resource protocols."

[[tool.skylos.dead_code.entrypoints]]
type = "parameter"
full_name = ["episodic.api.authorization.PermitAll.decide.context"]
reason = "PermitAll preserves the authorization policy signature used by interchangeable implementations."

[[tool.skylos.dead_code.entrypoints]]
type = "parameter"
full_name = [
    "episodic.canonical.storage.source_intake_repositories.SqlAlchemyUploadRepository.mark_failed.reason",
]
reason = "The repository method implements UploadRepository.mark_failed; other adapters consume the reason."

[[tool.skylos.dead_code.entrypoints]]
type = "parameter"
full_name = [
    "episodic.metrics_ports.NoopBoundedMetrics.increment_counter.name",
    "episodic.metrics_ports.NoopBoundedMetrics.increment_counter.labels",
    "episodic.metrics_ports.NoopBoundedMetrics.observe_latency_ms.name",
    "episodic.metrics_ports.NoopBoundedMetrics.observe_latency_ms.value",
    "episodic.metrics_ports.NoopBoundedMetrics.observe_latency_ms.labels",
    "episodic.metrics_ports.NoopBoundedValueMetrics.observe_value.name",
    "episodic.metrics_ports.NoopBoundedValueMetrics.observe_value.value",
    "episodic.metrics_ports.NoopBoundedValueMetrics.observe_value.labels",
    "episodic.observability._ports.NoopMetrics.increment_counter.name",
    "episodic.observability._ports.NoopMetrics.increment_counter.labels",
    "episodic.observability._ports.NoopMetrics.observe_latency_ms.name",
    "episodic.observability._ports.NoopMetrics.observe_latency_ms.value",
    "episodic.observability._ports.NoopMetrics.observe_latency_ms.labels",
    "episodic.observability._ports.NoopValueMetrics.observe_value.name",
    "episodic.observability._ports.NoopValueMetrics.observe_value.value",
    "episodic.observability._ports.NoopValueMetrics.observe_value.labels",
    "episodic.observability._ports.NoopTracer.start_span.name",
    "episodic.observability._ports.NoopTracer.start_span.attributes",
    "episodic.observability._ports._NoopSpan.set_attribute.name",
    "episodic.observability._ports._NoopSpan.set_attribute.value",
]
reason = "No-op metrics and tracing adapters intentionally retain their runtime-selected protocol signatures."

[[tool.skylos.dead_code.entrypoints]]
type = "function"
full_name = [
    "alembic.versions.20260220_000002_add_profile_template_history_schema._drop_history_tables",
    "alembic.versions.20260220_000002_add_profile_template_history_schema._drop_episode_templates_table",
    "alembic.versions.20260610_000009_add_source_intake_tables._drop_enums",
    "alembic.versions.20260610_000009_add_source_intake_tables._downgrade_ingestion_jobs",
    "alembic.versions.20260610_000009_add_source_intake_tables._drop_uploads_table",
    "alembic.versions.20260610_000009_add_source_intake_tables._drop_ingestion_job_sources_table",
    "alembic.versions.20260610_000009_add_source_intake_tables._drop_idempotency_records_table",
