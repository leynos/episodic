# Detector settings for the blocking duplication gate, the installed
# `df12-duplication` command from df12-python-lints. `version` is the only
# nose pin: the command downloads that release and verifies it against the
# digest table shipped in the package. The three detection channels are pinned
# explicitly so a change to nose's defaults cannot widen or narrow the gate
# silently, and `surface = "all"` adjudicates nose's widened view rather than
# its five-family dashboard. `top = 0` adjudicates every family: the command
# refuses a saturated report, so a ranking cut cannot hide a family from the
# gate.
[tool.nose]
version = "0.20.0"
roots = ["episodic", "openai_test_types.py"]
mode = "syntax,semantic,near"
min-size = 24
surface = "all"
top = 0

# Reasoned exceptions for the duplication gate. Entries key on locations, not
# line spans: `path` (glob) matches any location in matching files, and
# `path::name` additionally requires nose's unit name. A `unit` entry names one
# key; a `members` entry names several. Either silences a family only when
# every location in it matches one of the entry's keys, so a new copy in an
# unlisted file still blocks. Record entries with
# `make duplication-allow FIRST=... [SECOND='...'] REASON=...` and remove them
# when the gate reports them as stale.
[tool.duplication_gate]

[[tool.duplication_gate.allow]]
unit = "episodic/api/resources/*.py::__init__"
reason = "Two-line resource constructors that store the injected unit-of-work factory; the repetition is the dependency-injection seam Falcon resources need."

[[tool.duplication_gate.allow]]
unit = "episodic/canonical/storage/*models.py"
reason = "SQLAlchemy declarative modules: dialect import headers, mapped_column timestamp and key declarations, and history-record docstrings are schema declarations whose repetition is the ORM's declarative style."

[[tool.duplication_gate.allow]]
members = ["episodic/canonical/storage/uow.py", "episodic/canonical/storage/__init__.py"]
reason = "Both modules import the same repository implementations, one to compose the unit of work and one to re-export the package surface."

[[tool.duplication_gate.allow]]
members = ["episodic/canonical/storage/mappers.py", "episodic/canonical/storage/reference_repositories.py"]
reason = "Shared reference-mapper import block; the mappers module re-exports what the repositories module consumes."

[[tool.duplication_gate.allow]]
members = ["episodic/canonical/storage/entity_mappers.py", "episodic/canonical/storage/models.py"]
reason = "Record import block shared by the mapper module and the aggregating models module."

[[tool.duplication_gate.allow]]
members = ["episodic/canonical/ports.py", "episodic/canonical/__init__.py"]
reason = "Port re-export blocks; the package surface and the ports facade deliberately list the same protocol names."

[[tool.duplication_gate.allow]]
members = ["episodic/canonical/reference_documents/__init__.py", "episodic/canonical/reference_documents/services.py"]
reason = "Service re-export blocks; the package surface and the services facade list the same operations."

[[tool.duplication_gate.allow]]
members = ["episodic/orchestration/_guest_bios_executor.py", "episodic/orchestration/_show_notes_executor.py"]
reason = "Per-tool executors: an identical import surface and an error-translation dispatcher that each bind their own domain exception pair and tool label at the point of use."

[[tool.duplication_gate.allow]]
members = ["episodic/llm/openai_api/adapter.py", "episodic/llm/openai_adapter.py"]
